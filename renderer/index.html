<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; media-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval';" />
  <title>Local Shuffle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <video id="video" preload="metadata"></video>
    <div id="empty-overlay" class="overlay">
      <p>動画フォルダを開いてください (O キー)</p>
    </div>
  </div>

  <div id="controls">
    <div id="seekbar-row">
      <span id="time-current">0:00</span>
      <input type="range" id="seekbar" min="0" max="1000" value="0" step="1" />
      <span id="time-total">0:00</span>
    </div>
    <div id="buttons-row">
      <button id="btn-open" title="フォルダを開く (O)">Open</button>
      <button id="btn-prev" title="前へ (Shift+B)">⏮</button>
      <button id="btn-playpause" title="再生/一時停止 (Space / K)">▶</button>
      <button id="btn-next" title="次へ (Shift+N)">⏭</button>
      <button id="btn-shuffle" title="シャッフル (R)">🔀 Off</button>
      <button id="btn-mute" title="ミュート (M)">🔊</button>
      <input type="range" id="volume" min="0" max="100" value="80" step="1" title="音量 (↑↓)" />
      <span id="speed" title="再生速度 — &gt; / &lt; で ±0.25, D / S で ±0.1, クリックで 1.00x">1.00x</span>
      <button id="btn-queue" title="キューを表示 (Q)">≡</button>
      <button id="btn-properties" title="プロパティ (I)">ⓘ</button>
      <button id="btn-settings" title="設定">⚙</button>
      <button id="btn-fullscreen" title="フルスクリーン (F)">⛶</button>
      <span id="filename"></span>
    </div>

    <dialog id="settings-modal">
      <div class="prop-frame">
        <div class="prop-header">
          <span class="prop-blip"></span>
          <span class="prop-title">SETTINGS</span>
          <span class="prop-spacer"></span>
          <button id="settings-close" class="prop-close" title="閉じる (Esc)">×</button>
        </div>
        <div class="prop-body">
          <div class="prop-section">
            <div class="prop-section-head">[ SHORTCUT_MODE ]</div>
            <label class="setting-row">
              <input type="radio" name="shortcutMode" value="youtube" />
              <div>
                <div class="setting-title">YouTube 互換</div>
                <div class="setting-desc">前/次/速度は <code>Shift+B</code> / <code>Shift+N</code> / <code>Shift+,</code> / <code>Shift+.</code></div>
              </div>
            </label>
            <label class="setting-row">
              <input type="radio" name="shortcutMode" value="simple" />
              <div>
                <div class="setting-title">シンプル(Shift 不要)</div>
                <div class="setting-desc">前/次/速度を <code>B</code> / <code>N</code> / <code>,</code> / <code>.</code> だけで操作。Shift+ 版も併用可</div>
              </div>
            </label>
          </div>

          <div class="prop-section">
            <div class="prop-section-head">[ BOSS_KEY ]</div>
            <label class="setting-row">
              <input type="radio" name="bossKeyMode" value="toggle" />
              <div>
                <div class="setting-title">トグル(押すごとに切替)</div>
                <div class="setting-desc"><code>W</code> を一度押すとオン、もう一度押すとオフ</div>
              </div>
            </label>
            <label class="setting-row">
              <input type="radio" name="bossKeyMode" value="hold" />
              <div>
                <div class="setting-title">ホールド(押している間だけ)</div>
                <div class="setting-desc"><code>W</code> を押している間だけオン、離すとオフ</div>
              </div>
            </label>
          </div>

          <div class="prop-section">
            <div class="prop-section-head">[ AUDIO ]</div>
            <label class="setting-row">
              <input type="checkbox" id="setting-replaygain" />
              <div>
                <div class="setting-title">ReplayGain(動画間の音量差を抑える)</div>
                <div class="setting-desc">YouTube 系の手法に寄せて、K-weighting(ITU-R BS.1770 近似:38Hz HPF + 1.5kHz +4dB ハイシェルフ)を通したラウドネスを動画ごとに最大10秒間測定 → 中央値でゲインを **動画ごとに一度だけ固定**。補正幅は ×0.3 〜 ×4.0。一度測った動画のゲインはファイルパス単位でキャッシュされるので、次回以降は即座に適用される。動画内では一定、動画間では揃う。デフォルト オン。</div>
                <div class="setting-desc" id="rg-status">locked gain: <code id="rg-gain">1.00x</code></div>
              </div>
            </label>
          </div>

          <div class="prop-section">
            <div class="prop-section-head">[ EXPERIMENTAL / 開発中 ]</div>
            <div class="setting-desc" style="padding: 8px 4px; opacity: 0.75;">
              ここには将来テスト中の機能を追加していく予定。
            </div>
          </div>
        </div>
        <div class="prop-footer">
          <span class="prop-cursor">_</span>
        </div>
      </div>
    </dialog>

    <aside id="queue-panel" aria-hidden="true">
      <div class="queue-frame">
        <div class="queue-header">
          <span class="prop-blip"></span>
          <span class="queue-title">UP_NEXT</span>
        </div>
        <ol id="queue-list" class="queue-list"></ol>
        <div class="queue-footer">
          <span class="prop-cursor">_</span><span id="queue-count"></span>
        </div>
      </div>
    </aside>

    <div id="boss-overlay" aria-hidden="true"></div>
    <!-- W toggles boss mode (press once: on, press again: off) -->

    <dialog id="properties-modal">
      <div class="prop-frame">
        <div class="prop-header">
          <span class="prop-blip"></span>
          <span class="prop-title">FILE_PROPERTIES</span>
          <span class="prop-spacer"></span>
          <button id="prop-close" class="prop-close" title="閉じる (Esc)">×</button>
        </div>
        <div class="prop-body" id="prop-body">
          <div class="prop-loading">[ analyzing... ]</div>
        </div>
        <div class="prop-footer">
          <span class="prop-cursor">_</span>
        </div>
      </div>
    </dialog>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
